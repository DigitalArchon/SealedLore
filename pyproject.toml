[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sealedlore"
version = "3.1.0b12"
description = "Desktop app for collaborative fiction roleplay with an LLM."
readme = "README.md"
# AGPL for everyone; other terms for SealedLore's own code by separate
# agreement (README, "Licence").
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Digital Archon" }]
keywords = ["fiction", "roleplay", "llm", "writing", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "numpy>=1.26",
    # Below 6.12: 6.12.0 drops a reference to None on every call that
    # returns nothing, which aborts Python 3.11 (None is immortal from 3.12
    # on), and deletes a widget twice at exit. The AppImage locks 6.11.3.
    "PySide6>=6.6,<6.12",
    # End-to-end encrypted private models (providers/private_mode.py): Tinfoil's
    # own attestation and EHBP client, pinned exactly: it holds the plaintext.
    # tinfoil asks only for tinfoil-ehbp>=0.3.0, so the library that seals and
    # opens the bodies, and the HPKE under it, are pinned here too, at the
    # AppImage lock's versions (tests/test_private_mode.py checks they agree).
    "tinfoil==0.15.0",
    "tinfoil-ehbp==0.4.1",
    "pyhpke==0.6.5",
    # API keys in the system keychain (storage/keychain.py): the Secret
    # Service on Linux, Credential Manager on Windows.
    "keyring>=25",
    # Floors, as the AppImage's requirements.in sets them, for a source install
    # too: certifi without the eMudhra root (emSign ECC Root CA - G3, Oct 2026);
    # cryptography (the TEE checks use it), pyasn1 and dnspython past their
    # advisories (packaging/appimage/requirements.in says which).
    "certifi>=2026.10.19",
    "cryptography>=50.0.2",
    "pyasn1>=0.6.5",
    "dnspython>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/DigitalArchon/SealedLore"
Issues = "https://github.com/DigitalArchon/SealedLore/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Exact: a newer ruff formats differently, and CI's format check would
    # fail on code nobody changed.
    "ruff==0.16.9",
]

[project.scripts]
sealedlore = "sealedlore.cli:main"
sealedlore-gui = "sealedlore.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sealedlore = ["gui/*.qss", "phone/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The excludes below hold for a file named on the command line too (an
# editor formatting on save).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Dev tooling: long prompt strings and one-line reports.
"tools/*" = ["E501"]
# Intel's and NVIDIA's checks, and the guard on Tinfoil's SDK and Sigstore's
# fetches, word for word as in the author's other apps that attest TEE or
# private models (only the import lines differ), so that a diff shows they
# are alike: neither reformatted nor rewrapped here.
"src/sealedlore/providers/dcap.py" = ["E501"]
"src/sealedlore/providers/nras.py" = ["E501"]
"src/sealedlore/providers/sdk_guard.py" = ["E501"]

[tool.ruff.format]
exclude = [
    "src/sealedlore/providers/dcap.py",
    "src/sealedlore/providers/nras.py",
    "src/sealedlore/providers/sdk_guard.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test still running after this long prints every thread's stack (it isn't
# stopped): a modal dialog nobody answers otherwise hangs the run in silence.
faulthandler_timeout = 300
markers = [
    "real_crop: the crop dialog is driven by the test, not answered for it",
    "real_follow_up: the follow-up dialog is driven by the test, not gone past for it",
]
