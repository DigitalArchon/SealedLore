  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#2b3040" stroke-width="4"/>
  <!-- The pages, showing past the cover's right and bottom edges. -->
  <rect x="76" y="54" width="122" height="156" rx="8" fill="#d8dbe2"/>
  <g stroke="#a9b1d6" stroke-width="3" stroke-linecap="round">
    <line x1="190" y1="70" x2="190" y2="196"/>
    <line x1="92" y1="203" x2="184" y2="203"/>
  </g>
  <!-- The cover and its spine. -->
  <rect x="60" y="44" width="126" height="158" rx="10" fill="#3d59a1"/>
  <rect x="60" y="44" width="22" height="158" rx="10" fill="#2e4480"/>
  <rect x="74" y="44" width="8" height="158" fill="#2e4480"/>
  <line x1="82" y1="48" x2="82" y2="198" stroke="#7aa2f7" stroke-width="3"/>
  <!-- The ribbon that binds it, over the cover and round the pages. -->
  <rect x="60" y="110" width="140" height="26" fill="#bb9af7"/>
  <rect x="186" y="110" width="14" height="26" fill="#9d7cd8"/>
