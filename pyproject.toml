[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sealedlore"
version = "1.0.0b6"
description = "Desktop app for collaborative fiction roleplay with an LLM."
readme = "README.md"
# AGPL for everyone; other terms for SealedLore's own code by separate
# agreement (README, "Licence").
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Digital Archon" }]
keywords = ["fiction", "roleplay", "llm", "writing", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "numpy>=1.26",
    # Below 6.12: 6.12.0 drops a reference to None on every call that
    # returns nothing, which aborts Python 3.11 (None is immortal from 3.12
    # on), and deletes a widget twice at exit. The AppImage locks 6.11.2.
    "PySide6>=6.6,<6.12",
    # End-to-end encrypted private models (providers/private_mode.py): Tinfoil's
    # own attestation and EHBP client, pinned exactly: it holds the plaintext.
    "tinfoil==0.14.0",
    # API keys in the system keychain (storage/keychain.py): the Secret
    # Service on Linux, Credential Manager on Windows.
    "keyring>=25",
]

[project.urls]
Homepage = "https://github.com/DigitalArchon/SealedLore"
Issues = "https://github.com/DigitalArchon/SealedLore/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
sealedlore = "sealedlore.cli:main"
sealedlore-gui = "sealedlore.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sealedlore = ["gui/*.qss"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Dev tooling: long prompt strings and one-line reports.
"tools/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
