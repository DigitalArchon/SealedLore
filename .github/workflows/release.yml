name: Release

# Pushing a tag vX.Y.Z builds the AppImage from that commit, attests it (a
# signed record that this workflow built these bytes from this commit), and
# opens a draft release with the AppImage and its .sha256 attached. Publish
# the draft by hand once its notes are written.
#
# Run by hand (Actions → Release → Run workflow) it only builds, and the
# checksum is on the run's summary page: a way to check that GitHub's build
# matches a local one of the same commit.
#
# The build is reproducible (packaging/appimage/build.sh), so anyone can
# rebuild a tag and compare checksums; the attestation is for those who
# won't. Attestations need a public repository on GitHub's free plans.
#
# Actions are pinned by commit, as every input to the build is by checksum.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      appimage: ${{ steps.build.outputs.appimage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not bundled: what the build's checks resolve Qt against (the xcb
      # plugin's libraries, QtMultimedia's, and the import test). Nothing here goes into the
      # AppImage.
      - name: Host libraries for the checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64 \
            libx11-6 libx11-xcb1 libxcb1 libxcb-randr0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libpulse0 libxrandr2 libxext6

      - name: Build
        id: build
        run: |
          packaging/appimage/build.sh
          appimage="$(cd dist && ls SealedLore-*-x86_64.AppImage)"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          {
            echo "### $appimage"
            echo
            echo "Commit \`$(git rev-parse HEAD)\`"
            echo
            echo '```'
            cat "dist/$appimage.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage
          path: dist/SealedLore-*-x86_64.AppImage*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the draft release
      id-token: write # the short-lived signing certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage
          path: dist

      # The tag names the version the AppImage says it is, or nothing is released.
      - name: Tag matches the version
        env:
          APPIMAGE: ${{ needs.build.outputs.appimage }}
        run: |
          expected="SealedLore-${GITHUB_REF_NAME#v}-x86_64.AppImage"
          if [ "$APPIMAGE" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME built $APPIMAGE, expected $expected" >&2
            exit 1
          fi
          (cd dist && sha256sum -c "$APPIMAGE.sha256")

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.appimage }}

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: ${{ needs.build.outputs.appimage }}
        run: |
          {
            echo "## Checking the download"
            echo
            echo '```'
            cat "dist/$APPIMAGE.sha256"
            echo '```'
            echo
            echo "Built by GitHub Actions from \`$GITHUB_SHA\`, and attested. With the GitHub CLI:"
            echo
            echo '```'
            echo "gh attestation verify $APPIMAGE --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "Or rebuild it: check out \`$GITHUB_REF_NAME\`, run \`packaging/appimage/build.sh\`,"
            echo "and compare the checksum. The build is reproducible."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "SealedLore ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            "dist/$APPIMAGE" "dist/$APPIMAGE.sha256"
