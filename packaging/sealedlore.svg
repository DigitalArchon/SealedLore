  <circle cx="134" cy="123" r="22" fill="none" stroke="#b8435a" stroke-width="4"/>
  <circle cx="134" cy="117" r="7" fill="#5c1f2c"/>
  <path d="M130 120 L127 136 L141 136 L138 120 Z" fill="#5c1f2c"/>
