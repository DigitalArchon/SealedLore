name: Windows

# The test suite on Windows, run by hand only (Actions → Windows → Run
# workflow). Linux is the real version and CI's; this checks that running
# from source on Windows still works (docs/manual.md, "Windows (from
# source)"), and runs the tests that need a real Windows
# (tests/test_windows.py: the data folder's ACL, the crash guard). Windows
# minutes count double on a private repository, hence no trigger on master.
#
# Actions are pinned by commit, as in release.yml.

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q -rs

      # What Qt measures with here, for comparing against Linux when a layout
      # test fails. Runs whatever the tests did.
      - name: Qt metrics
        if: always()
        run: python tools/smoke/qt_metrics.py
